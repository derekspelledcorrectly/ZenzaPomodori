<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Track rings -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#e0dbd2" stroke-width="1.5" opacity="0.5"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#e0dbd2" stroke-width="1.5" opacity="0.4"/>
  <!-- Outer arc (orange) ~70% -->
  <circle cx="16" cy="16" r="13.5" fill="none"
    stroke="#e8943a" stroke-width="2.5"
    stroke-dasharray="59 85" stroke-linecap="round"
    transform="rotate(-90 16 16)"/>
  <!-- Inner arc (teal) ~55% -->
  <circle cx="16" cy="16" r="9.5" fill="none"
    stroke="#59c8b3" stroke-width="2.5"
    stroke-dasharray="33 60" stroke-linecap="round"
    transform="rotate(-90 16 16)"/>
</svg>
